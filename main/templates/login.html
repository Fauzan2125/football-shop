{% extends 'base.html' %}
{% block meta %}<title>Login - Football Shop</title>{% endblock meta %}
{% block content %}
<div class="bg-gray-50 w-full min-h-screen flex items-center justify-center p-8">
  <div class="max-w-md w-full">
    <div class="bg-white rounded-lg border border-gray-200 p-6 sm:p-8 form-style">
      <div class="text-center mb-8"><h1 class="text-2xl font-bold text-gray-900 mb-2">Sign In</h1><p class="text-gray-600">Welcome back to Football Shop</p></div>
      <div id="form-errors" class="mb-4"></div>
      <form id="login-form" class="space-y-6">
        {% csrf_token %}
        <div><label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label><input id="username" name="username" type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-md" placeholder="Enter your username"></div>
        <div><label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label><input id="password" name="password" type="password" required class="w-full px-4 py-3 border border-gray-300 rounded-md" placeholder="Enter your password"></div>
        <button type="submit" class="w-full bg-blue-600 text-white font-medium py-3 px-4 rounded-md hover:bg-blue-700">Sign In</button>
      </form>
      <div class="mt-6 text-center pt-6 border-t border-gray-200"><p class="text-gray-500 text-sm">Don't have an account? <a href="{% url 'main:register' %}" class="text-blue-600 hover:text-blue-700 font-medium">Register Now</a></p></div>
    </div>
  </div>
</div>
<script>
  document.getElementById('login-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const errorContainer = document.getElementById('form-errors');
    errorContainer.innerHTML = '';
    const formData = new FormData(event.target);
    try {
      const response = await fetch("{% url 'main:login_ajax' %}", { method: "POST", body: formData, headers: { "X-CSRFToken": formData.get('csrfmiddlewaretoken') } });
      if (response.ok) { window.location.href = "{% url 'main:show_main' %}"; }
      else { const data = await response.json(); errorContainer.innerHTML = `<div class="px-4 py-3 rounded-md text-sm border bg-red-50 border-red-200 text-red-700">${data.message}</div>`; showToast("Login Failed", "Check credentials.", "error"); }
    } catch (error) { console.error("Error:", error); showToast("An Error Occurred", "Could not connect.", "error"); }
  });
</script>
{% endblock content %}
