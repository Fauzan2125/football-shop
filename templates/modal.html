<div id="crudModal" class="hidden fixed inset-0 z-50 w-full flex items-center justify-center bg-gray-800 bg-opacity-50">
    <div id="crudModalContent" class="bg-white rounded-lg shadow-lg w-5/6 sm:w-3/5 md:w-1/2 lg:w-2/5 xl:w-1/3 max-h-screen overflow-y-auto">
        <div class="flex items-center justify-between p-4 border-b">
            <div><h3 id="modal-title" class="text-xl font-semibold text-gray-900"></h3><p id="modal-subtitle" class="text-sm text-gray-600 mt-1"></p></div>
            <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center" onclick="hideModal()"><svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></button>
        </div>
        <div class="px-6 py-4">
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="product-id" name="product_id">
                <div><label for="name" class="block text-sm font-medium text-gray-700">Name</label><input type="text" id="name" name="name" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label for="price" class="block text-sm font-medium text-gray-700">Price</label><input type="number" id="price" name="price" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required></div>
                    <div><label for="stock" class="block text-sm font-medium text-gray-700">Stock</label><input type="number" id="stock" name="stock" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required></div>
                </div>
                <div><label for="description" class="block text-sm font-medium text-gray-700">Description</label><textarea id="description" name="description" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required></textarea></div>
                <div><label for="brand" class="block text-sm font-medium text-gray-700">Brand</label><input type="text" id="brand" name="brand" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label for="category" class="block text-sm font-medium text-gray-700">Category</label><select id="category" name="category" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required><option value="">Choose a category</option><option value="jersey">Jersey</option><option value="sepatu">Sepatu Bola</option><option value="perlengkapan">Perlengkapan Latihan</option></select></div>
                    <div><label for="size" class="block text-sm font-medium text-gray-700">Size</label><select id="size" name="size" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required><option value="">Choose a size</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option></select></div>
                </div>
                <div><label for="thumbnail" class="block text-sm font-medium text-gray-700">Thumbnail URL</label><input type="url" id="thumbnail" name="thumbnail" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
                <div class="flex items-center"><input id="is_featured" name="is_featured" type="checkbox" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded"><label for="is_featured" class="ml-2 text-sm font-medium text-gray-900">Featured Product</label></div>
            </form>
        </div>
        <div class="flex flex-col sm:flex-row gap-4 p-6 border-t border-gray-200 rounded-b">
            <button type="button" class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md font-medium hover:bg-gray-50 text-center" onclick="hideModal()">Cancel</button>
            <button type="submit" id="submit-button" form="productForm" class="order-1 sm:order-2 flex-1 bg-blue-600 text-white px-6 py-3 rounded-md font-medium hover:bg-blue-700"></button>
        </div>
    </div>
</div>
<script>
    // --- STATE MODAL ---
    let isEditMode = false;
    let currentProductId = null;

    // --- ELEMENT DOM MODAL ---
    const modal = document.getElementById('crudModal');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const submitButton = document.getElementById('submit-button');
    const productForm = document.getElementById('productForm');
    const productIdField = document.getElementById('product-id');

    // --- URL ENDPOINTS (DENGAN PERBAIKAN) ---
    const ADD_URL = "{% url 'main:add_product_ajax' %}";
    const EDIT_URL_BASE = "{% url 'main:edit_product_ajax' '00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000/', '');
    const GET_DETAIL_URL_BASE = "{% url 'main:get_product_detail_json' '00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000/', '');


    // --- FUNGSI-FUNGSI ---
    function hideModal() {
        modal.classList.add('hidden');
        productForm.reset();
        isEditMode = false;
        currentProductId = null;
        productIdField.value = "";
    }

    function showCreateModal() {
        isEditMode = false;
        modalTitle.textContent = "Create New Product";
        modalSubtitle.textContent = "Share your football products";
        submitButton.textContent = "Publish Product";
        modal.classList.remove('hidden');
    }

    async function showEditModal(productId) {
        isEditMode = true;
        currentProductId = productId;
        productIdField.value = productId;

        modalTitle.textContent = "Edit Product";
        modalSubtitle.textContent = "Update product details";
        submitButton.textContent = "Update Product";

        try {
            const response = await fetch(`${GET_DETAIL_URL_BASE}${productId}/`);
            const data = await response.json();

            for (const key in data) {
                if (document.getElementById(key)) {
                    const el = document.getElementById(key);
                    el.type === 'checkbox' ? el.checked = data[key] : el.value = data[key];
                }
            }
            modal.classList.remove('hidden');
        } catch (error) {
            console.error("Error fetching product details:", error);
            showToast("Error", "Could not load product data.", "error");
        }
    }

    async function handleFormSubmit(event) {
        event.preventDefault();
        const formData = new FormData(productForm);
        const url = isEditMode ? `${EDIT_URL_BASE}${currentProductId}/` : ADD_URL;
        const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

        try {
            const response = await fetch(url, {
                method: 'POST',
                body: formData,
                headers: { "X-CSRFToken": csrfToken }
            });

            if (response.ok) {
                hideModal();
                showToast('Success', isEditMode ? 'Product updated!' : 'Product added!', 'success');
                document.dispatchEvent(new CustomEvent('productChange'));
            } else {
                throw new Error('Server error.');
}
        } catch (error) {
            console.error("Form submission error:", error);
            showToast('Error', isEditMode ? 'Failed to update.' : 'Failed to add.', 'error');
        }
    }

    productForm.addEventListener("submit", handleFormSubmit);
</script>
