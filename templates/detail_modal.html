<div id="productDetailModal" class="hidden fixed inset-0 z-50 w-full flex items-center justify-center bg-gray-800 bg-opacity-75">
    <div class="bg-white rounded-lg shadow-xl w-11/12 sm:w-4/5 md:w-3/5 lg:w-1/2 max-h-[90vh] overflow-y-auto">
        <div class="sticky top-0 bg-white flex items-center justify-between p-4 border-b z-10">
            <h3 class="text-xl font-semibold text-gray-900">Product Detail</h3>
            <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 rounded-lg text-sm p-1.5 ml-auto" onclick="hideProductDetailModal()">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            </button>
        </div>
        <div id="detail-modal-content" class="p-6 sm:p-8">
            <div class="text-center py-10">Loading...</div>
        </div>
    </div>
</div>

<script>
    const detailModal = document.getElementById('productDetailModal');
    const detailModalContent = document.getElementById('detail-modal-content');
    const DETAIL_API_BASE_URL = "{% url 'main:get_product_for_detail_view_json' '00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000/', '');

    function hideProductDetailModal() {
        detailModal.classList.add('hidden');
        detailModalContent.innerHTML = '<div class="text-center py-10">Loading...</div>'; // Reset konten
    }

    async function showProductDetailModal(productId) {
        detailModal.classList.remove('hidden');
        try {
            const response = await fetch(`${DETAIL_API_BASE_URL}${productId}/`);
            if (!response.ok) throw new Error("Failed to fetch details.");
            const data = await response.json();

            const formattedPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(data.price);
            
            detailModalContent.innerHTML = `
                ${data.thumbnail ? `<img src="${data.thumbnail}" alt="${data.name}" class="w-full h-64 object-cover rounded-lg mb-6">` : ''}
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-3xl font-bold text-gray-900">${data.name}</h2>
                    <span class="text-sm font-medium bg-blue-100 text-blue-800 px-3 py-1 rounded-full">${data.category}</span>
                </div>
                <p class="text-4xl font-bold text-blue-600 mb-6">${formattedPrice}</p>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-sm mb-6 text-center">
                    <div class="bg-gray-50 p-3 rounded-lg"><span class="block font-semibold text-gray-700">Brand</span> <span class="text-gray-600">${data.brand}</span></div>
                    <div class="bg-gray-50 p-3 rounded-lg"><span class="block font-semibold text-gray-700">Stock</span> <span class="text-gray-600">${data.stock} available</span></div>
                    <div class="bg-gray-50 p-3 rounded-lg"><span class="block font-semibold text-gray-700">Size</span> <span class="text-gray-600">${data.size}</span></div>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 border-b pb-2 mb-4">Product Description</h3>
                <div class="prose max-w-none text-gray-700 whitespace-pre-line">${data.description}</div>
                <div class="mt-6 pt-4 border-t text-sm text-gray-500">
                    <span>Added by: ${data.user_username}</span> | <span>${data.product_views} views</span>
                </div>
            `;
        } catch(error) {
            console.error("Error showing detail:", error);
            detailModalContent.innerHTML = '<div class="text-center py-10 text-red-600">Failed to load product details.</div>';
        }
    }
</script>
